name: V2 native build verification
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/v2-native.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci && npm run build
      - run: npx cap add android && npx cap sync android && npm run native:configure
      - run: cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: stockflow-v2-android-debug
          path: mobile/android/app/build/outputs/apk/debug/*.apk
  ios-simulator:
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci && npm run build
      - run: npx cap add ios && npx cap sync ios && npm run native:configure
      - run: cd ios/App && xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Package unsigned simulator app
        run: ditto -c -k --sequesterRsrc --keepParent ios/App/build/Build/Products/Debug-iphonesimulator/App.app StockFlowV2-simulator.zip
      - uses: actions/upload-artifact@v4
        with:
          name: stockflow-v2-ios-simulator
          path: mobile/StockFlowV2-simulator.zip
          retention-days: 14
