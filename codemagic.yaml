# ============================================================================
# Codemagic CI/CD — StockFlow mobile app (mobile/)
# ============================================================================
# The static PWA at the repo root deploys via Netlify/Cloudflare Pages and is
# NOT built here. Codemagic builds the Next.js (static export) + Capacitor
# mobile app that lives in mobile/.
#
# Lint / unit tests / static export are run for free by GitHub Actions
# (.github/workflows/mobile-ci.yml) on every push and PR. Codemagic's role is
# the one thing GitHub Actions can't do here: assemble the Android APK.
#
# Setup (one-time, in the Codemagic dashboard — https://codemagic.io):
#   1. Add application → connect the zitch-systems/stockflow GitHub repo.
#   2. Select "codemagic.yaml" as the project type — this file is auto-detected.
#   3. Run the "android-debug" workflow to get an installable debug APK
#      artifact from the build's Artifacts tab.
# Release signing (later): create an Android keystore group in Codemagic
# (Teams → environment variables) and a gradle signing config before
# switching assembleDebug → bundleRelease. See mobile/README.md.
# ============================================================================

workflows:
  android-debug:
    name: Android debug APK (Capacitor)
    instance_type: linux_x2
    max_build_duration: 45
    environment:
      # Pin to the same major that GitHub Actions uses (setup-node@v4 '22').
      node: 22
      java: 21
    cache:
      cache_paths:
        - ~/.npm
        - ~/.gradle/caches
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
        - pattern: 'claude/nextjs-mobile-app-setup-*'
          include: true
          source: true
      cancel_previous_builds: true
    when:
      changeset:
        includes:
          - 'mobile/**'
          - 'codemagic.yaml'
    scripts:
      - name: Install dependencies
        script: |
          cd mobile
          npm ci
      - name: Build web assets (Next.js static export)
        script: |
          cd mobile
          npm run build
      - name: Generate Android project (Capacitor)
        # android/ is gitignored until native customization begins, so it is
        # (re)generated from capacitor.config.ts on every build.
        script: |
          cd mobile
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - mobile/android/app/build/outputs/**/*.apk
    # Uncomment and fill in to get build emails:
    # publishing:
    #   email:
    #     recipients:
    #       - you@example.com
