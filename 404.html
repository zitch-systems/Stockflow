*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root[data-theme="light"]{

:root[data-theme="dark"]{

body{
  font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--tp);

}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:56px;cursor:pointer}
.brand-mark{width:36px;height:36px;border-radius:10px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:20px}
.brand-text{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;letter-spacing:-.02em;color:var(--tp)}
.brand-text span{color:var(--accent)}
.code{font-family:'Sora',sans-serif;font-weight:800;font-size:clamp(80px,18vw,160px);letter-spacing:-.04em;line-height:1;color:var(--brand);margin-bottom:20px;position:relative}
.code::after{content:'';position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:60px;height:4px;background:var(--accent);border-radius:2px}
h1{font-family:'Sora',sans-serif;font-weight:700;font-size:26px;letter-spacing:-.02em;line-height:1.15;margin-bottom:12px;margin-top:20px}
p{font-size:15px;color:var(--ts);max-width:420px;line-height:1.6;margin:0 auto 32px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:7px;padding:11px 22px;border-radius:8px;font-family:'Sora',sans-serif;font-size:14px;font-weight:600;border:1px solid transparent;text-decoration:none;transition:all .12s;cursor:pointer}
.btn-primary{background:var(--brand);color:#fff}
.btn-primary:hover{background:var(--brand-mid)}
.btn-ghost{background:transparent;color:var(--ts);border-color:var(--border)}
.btn-ghost:hover{background:var(--surface);color:var(--tp);border-color:var(--brand-mid)}
.theme-toggle{position:fixed;top:16px;right:16px;width:36px;height:36px;border-radius:8px;background:var(--surface);border:1px solid var(--border);color:var(--ts);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.theme-toggle:hover{background:var(--brand-light);color:var(--brand-mid)}
</style>

<script>
(function applyTheme(){
  const saved = localStorage.getItem('sf_theme') || (matchMedia('(prefers-color-scheme:dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
})();
function toggleTheme() {
  const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('sf_theme', next);
  updateThemeIcon(next);
}
function updateThemeIcon(t) {
  const ic = document.getElementById('themeIcon'); if (!ic) return;
  ic.innerHTML = t === 'dark'
    ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>';
}
