<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root[data-theme="light"]{
  color-scheme:light;
  --brand:#1A3C5E;--brand-mid:#2563A8;--brand-light:#EBF2FB;
  --accent:#F97316;--accent-light:#FFF4EC;
  --success:#16A34A;--success-bg:#F0FDF4;
  --danger:#DC2626;--danger-bg:#FEF2F2;
  --warn:#D97706;--warn-bg:#FFFBEB;
  --tp:#0F1923;--ts:#5A6A7A;--tm:#64748B;
  --bg:#F0F4F8;--surface:#fff;--surface-2:#F8FAFC;--border:#E2E8F0;
  --shadow:0 6px 20px rgba(15,25,35,.08),0 2px 4px rgba(15,25,35,.04);
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --brand:#3B82F6;--brand-mid:#60A5FA;--brand-light:#1E3A5F;
  --accent:#FB923C;--accent-light:#3D2616;
  --success:#34D399;--success-bg:#0F2E1F;
  --danger:#F87171;--danger-bg:#3D1818;
  --warn:#FBBF24;--warn-bg:#3D2E0A;
  --tp:#F1F5F9;--ts:#A8B5C2;--tm:#8B98A8;
  --bg:#0B1220;--surface:#131C2D;--surface-2:#1A2438;--border:#243047;
  --shadow:0 6px 20px rgba(0,0,0,.5),0 2px 4px rgba(0,0,0,.3);
}

html,body{min-height:100vh}
body{
  font-family:'DM Sans',sans-serif;
  background:var(--bg);color:var(--tp);
  font-size:15px;line-height:1.55;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
  text-rendering:optimizeLegibility;
  font-feature-settings:'kern' 1,'liga' 1,'calt' 1;
  display:flex;flex-direction:column;
  transition:background .25s ease,color .25s ease;
  touch-action:manipulation;
  -webkit-tap-highlight-color:transparent;
  accent-color:var(--brand);
  caret-color:var(--brand);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit;color:inherit}
a{color:var(--brand-mid);text-decoration:none}
a:hover{text-decoration:underline}

::selection{background:var(--brand-light);color:var(--brand)}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--tm);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:var(--ts)}
html{scrollbar-width:thin;scrollbar-color:var(--tm) transparent}
svg{shape-rendering:geometricPrecision}
:focus-visible{outline:2px solid var(--brand-mid);outline-offset:2px;border-radius:4px}
button,input,a,.btn,.topbar-link,.card{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.topbar{
  background:var(--brand);height:60px;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 24px;border-bottom:1px solid var(--brand);
  transition:background .25s ease;
}
.brand{display:flex;align-items:center;gap:10px;color:#fff;cursor:pointer}
.brand-mark{
  width:32px;height:32px;border-radius:8px;
  background:#fff;color:var(--brand);
  display:flex;align-items:center;justify-content:center;
  font-family:'Sora',sans-serif;font-weight:800;font-size:18px;
}
.brand-text{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;letter-spacing:-.02em;color:#fff}
.brand-text span{color:var(--accent)}
.topbar-right{display:flex;align-items:center;gap:6px}
.topbar-link{
  padding:7px 12px;border-radius:7px;
  font-size:13.5px;font-weight:500;color:rgba(255,255,255,.85);
  transition:all .12s;
}
.topbar-link:hover{color:#fff;background:rgba(255,255,255,.1);text-decoration:none}
.theme-btn{
  width:34px;height:34px;border-radius:7px;
  background:rgba(255,255,255,.1);color:#fff;
  display:inline-flex;align-items:center;justify-content:center;
  transition:background .12s;
}
.theme-btn:hover{background:rgba(255,255,255,.2)}

.shell{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px;background:var(--bg)}
.card{
  width:100%;max-width:420px;
  background:var(--surface);border:1px solid var(--border);
  border-radius:16px;padding:36px 36px 32px;
  box-shadow:var(--shadow);
  position:relative;overflow:hidden;
}
.card::before{
  content:'';position:absolute;top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,var(--brand) 0%,var(--brand-mid) 50%,var(--accent) 100%);
}
.card-eyebrow{
  font-size:11.5px;color:var(--brand-mid);
  text-transform:uppercase;letter-spacing:.14em;
  font-weight:600;margin-bottom:8px;
}
.card-title{text-wrap:balance;
  
  font-family:'Sora',sans-serif;font-weight:700;
  font-size:28px;letter-spacing:-.025em;line-height:1.15;
  margin-bottom:8px;color:var(--tp);
}
.card-subtitle{color:var(--ts);font-size:14.5px;margin-bottom:24px;line-height:1.55}

.field{margin-bottom:14px;position:relative}
.field-label{display:block;font-size:12.5px;font-weight:500;color:var(--ts);margin-bottom:6px}
.field input{
  width:100%;height:42px;padding:0 12px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--surface);color:var(--tp);font-size:14px;
  outline:none;transition:border-color .12s,box-shadow .12s;
}
.field input::placeholder{color:var(--tm)}
.field input:focus{border-color:var(--brand-mid);box-shadow:0 0 0 3px var(--brand-light)}
.pw-toggle{
  position:absolute;right:6px;bottom:6px;
  width:30px;height:30px;border-radius:6px;
  background:none;color:var(--tm);
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.pw-toggle:hover{background:var(--surface-2);color:var(--tp)}

.forgot-row{text-align:right;margin-top:-6px;margin-bottom:14px}
.forgot-row a{font-size:12.5px;color:var(--ts);font-weight:500}
.forgot-row a:hover{color:var(--brand-mid);text-decoration:none}

.btn{
  width:100%;height:46px;border-radius:8px;
  background:var(--accent);color:#fff;
  font-family:'Sora',sans-serif;font-size:14.5px;font-weight:600;
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .15s;
}
.btn:hover:not(:disabled){filter:brightness(1.08);transform:translateY(-1px);box-shadow:0 6px 16px rgba(249,115,22,.3)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn .spinner{display:none}
.btn.loading .spinner{display:block}
.btn.loading .btn-text{opacity:.7}
.spinner{
  width:14px;height:14px;
  border:2px solid rgba(255,255,255,.3);border-top-color:#fff;
  border-radius:50%;animation:spin .7s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

.err-box{
  display:none;
  padding:12px 14px;border-radius:8px;font-size:13px;
  margin-bottom:18px;
  background:var(--danger-bg);color:var(--danger);
  border:1px solid var(--danger);
  align-items:flex-start;gap:8px;line-height:1.5;
}
.err-box.show{display:flex}
.err-box.warn{background:var(--warn-bg);color:var(--warn);border-color:var(--warn)}

.foot{
  text-align:center;margin-top:18px;
  font-size:13.5px;color:var(--ts);
}
.foot a{color:var(--brand-mid);font-weight:600}

.page-foot{
  text-align:center;padding:24px;font-size:13px;color:var(--tm);
  background:var(--surface);border-top:1px solid var(--border);
}

@media (max-width:520px){
.topbar{padding:0 16px;height:56px}
  .topbar-link{display:none}
  .shell{padding:24px 16px}
  .card{padding:30px 24px 26px}
  .card-title{text-wrap:balance;
  font-size:24px}
  .brand-text{font-size:16px}
}

/* ── HiDPI / 4K / Retina sharpness ── */
@media (-webkit-min-device-pixel-ratio:2),(min-resolution:192dpi),(min-resolution:2dppx){
  .card,.field input,.btn,.topbar,.shell,.alert,.steps,.page-foot,
  .success-icon,.email-display,.resend-row,.forgot-row,.foot,
  .err-box,.pw-toggle{border-width:0.5px}
  .topbar{border-bottom-width:0.5px}
  .page-foot{border-top-width:0.5px}
  .card::before{height:3px}
}

/* ── Ultra-wide ── */
@media (min-width:1440px){
  .card{max-width:480px;padding:44px 44px 40px}
  .card-title{text-wrap:balance;
  font-size:32px}
}
@media (min-width:1800px){
  body{font-size:16px}
  .card{max-width:520px;padding:48px 48px 44px}
}

/* ── Reduced motion ── */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:0.01ms!important;
    animation-iteration-count:1!important;
    transition-duration:0.01ms!important;
    scroll-behavior:auto!important;
  }
}

/* ── Print ── */
@media print{
  .topbar,.page-foot{display:none!important}
  body{background:#fff;color:#000}
  .card{box-shadow:none;border:1px solid #ccc}
}

</style>
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StockFlow">
  <meta name="mobile-web-app-capable" content="yes">
</head>
<body>

<div class="topbar">
  <div class="brand" onclick="location.href='landing.html'">
    <div class="brand-mark">S</div>
    <div class="brand-text">Stock<span>Flow</span></div>
  </div>
  <div class="topbar-right">
    <span class="topbar-link" style="cursor:default;color:rgba(255,255,255,.7)">New here?</span>
    <a href="signup.html" class="topbar-link" style="background:rgba(255,255,255,.12);color:#fff;font-weight:600">Start free</a>
    <button class="theme-btn" onclick="toggleTheme()" aria-label="Toggle theme" title="Toggle theme">
      <svg id="themeIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/></svg>
    </button>
  </div>
</div>

<div class="shell">
  <form class="card" id="loginForm">
    <div class="card-eyebrow">Welcome back</div>
    <h1 class="card-title">Sign in to your account</h1>
    <p class="card-subtitle">Enter your email and password to continue.</p>

    <div class="err-box" id="errBox" role="alert"></div>

    <div class="field">
      <label class="field-label" for="email">Email</label>
      <input type="email" id="email" name="email" required autocomplete="email" placeholder="you@business.com">
    </div>

    <div class="field" style="position:relative">
      <label class="field-label" for="password">Password</label>
      <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••" style="padding-right:42px">
      <button type="button" onclick="togglePwd()" id="pwdToggle" class="pw-toggle" aria-label="Show password">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
    </div>

    <div class="forgot-row">
      <a href="forgot-password.html">Forgot password?</a>
    </div>

    <button type="submit" class="btn" id="signinBtn">
      <span class="spinner"></span>
      <span class="btn-text">Sign In</span>
    </button>

    <div class="foot">
      Don't have an account? <a href="signup.html">Start a free trial</a>
    </div>
  </form>
</div>

<div class="page-foot">© 2026 StockFlow</div>

<script src="/supabase.min.js"></script>
<script src="supabase-client.js"></script>
<script>
// THEME
(function applyTheme(){
  const saved = localStorage.getItem('sf_theme') || (matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  document.documentElement.setAttribute('data-theme', saved);
  updateThemeIcon(saved);
})();
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  localStorage.setItem('sf_theme', next);
  updateThemeIcon(next);
}
function updateThemeIcon(theme) {
  const ic = document.getElementById('themeIcon');
  if (!ic) return;
  ic.innerHTML = theme === 'dark'
    ? '<path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>'
    : '<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/>';
}

// PASSWORD VISIBILITY
function togglePwd() {
  const input = document.getElementById('password');
  const btn = document.getElementById('pwdToggle');
  if (input.type === 'password') {
    input.type = 'text';
    btn.setAttribute('aria-label', 'Hide password');
    btn.setAttribute('aria-pressed', 'true');
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
  } else {
    input.type = 'password';
    btn.setAttribute('aria-label', 'Show password');
    btn.setAttribute('aria-pressed', 'false');
    btn.innerHTML = '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
  }
}

// Guard against double-redirect: both checkExistingSession and onAuthStateChange
// can fire simultaneously (e.g. when an email confirmation link is clicked).
let _redirecting = false;
async function redirectToDashboard(userId) {
  if (_redirecting) return;
  _redirecting = true;
  const { data: profile } = await window.sb.from('profiles').select('role, is_active').eq('id', userId).single();
  if (profile && profile.is_active) {
    location.replace(window.dashboardForRole(profile.role));
  } else {
    _redirecting = false; // allow retry if profile not ready yet
  }
}

// If already logged in, route to dashboard
(async function checkExistingSession() {
  const { data: { session } } = await window.sb.auth.getSession();
  if (!session) return;
  redirectToDashboard(session.user.id);
})();

// Handle email confirmation redirect — Supabase exchanges the token from the URL
// and fires SIGNED_IN. With detectSessionInUrl: true this happens automatically.
window.sb.auth.onAuthStateChange(async function(event, session) {
  if ((event === 'SIGNED_IN' || event === 'USER_UPDATED') && session) {
    // Small delay to let the DB trigger finish creating the profile row
    await new Promise(function(r){ setTimeout(r, 800); });
    redirectToDashboard(session.user.id);
  }
});

// Expired-session notice
(function showExpiredNotice() {
  if (location.search.includes('expired=1')) {
    const errBox = document.getElementById('errBox');
    errBox.textContent = 'Your session expired for security. Please sign in again.';
    errBox.classList.add('show', 'warn');
  }
})();

// Login submit
document.getElementById('loginForm').addEventListener('submit', async function(e) {
  e.preventDefault();
  const btn = document.getElementById('signinBtn');
  const errBox = document.getElementById('errBox');
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  errBox.classList.remove('show','warn');
  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const { data: { session }, error } = await window.sb.auth.signInWithPassword({ email, password });
    if (error) {
      let msg = error.message || 'Sign in failed';
      if (msg.toLowerCase().includes('invalid')) msg = 'Email or password is incorrect.';
      throw new Error(msg);
    }
    const { data: profile, error: pe } = await window.sb.from('profiles').select('role, is_active').eq('id', session.user.id).single();
    if (pe || !profile) {
      // Profile doesn't exist yet — could be:
      // 1. Email not confirmed (trigger hasn't created profile)
      // 2. Staff account not fully set up by owner
      // 3. Database RLS issue (run stockflow-rls-helpers.sql)
      const hint = pe?.message?.includes('0 rows') || !profile
        ? 'Your account profile is not set up yet. If you were added as staff, ask your owner to check your account in the Staff tab. If you just signed up, make sure you confirmed your email first.'
        : 'Could not load your profile. Please try again.';
      throw new Error(hint);
    }
    if (!profile.is_active) {
      await window.sb.auth.signOut();
      throw new Error('Your account is deactivated. Contact your administrator.');
    }
    location.replace(window.dashboardForRole(profile.role));
  } catch (err) {
    const msg = err.message || 'Sign in failed';
    const isUnconfirmed = msg.toLowerCase().includes('email not confirmed') ||
                          msg.toLowerCase().includes('confirm your email') ||
                          msg.toLowerCase().includes('confirmation');
    errBox.innerHTML = isUnconfirmed
      ? 'Check your inbox and click the confirmation link first. ' +
        '<a href="#" onclick="resendConfirmation(event)" style="color:var(--brand-mid);font-weight:600;text-decoration:underline">Resend email</a>'
      : escapeHtml(msg);
    errBox.classList.add('show');
    btn.classList.remove('loading');
    btn.disabled = false;
  }
});

async function resendConfirmation(e) {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  const errBox = document.getElementById('errBox');
  if (!email) {
    errBox.textContent = 'Enter your email above first, then click Resend.';
    errBox.classList.add('show');
    return;
  }
  // Match the emailRedirectTo used at signup so the resent confirmation link
  // brings the user back to /login.html on the same origin they signed up from.
  const { error } = await window.sb.auth.resend({
    type: 'signup',
    email: email,
    options: { emailRedirectTo: window.location.origin + '/login.html' }
  });
  if (error) {
    const em = (error.message || '').toLowerCase();
    const code = error.status || 0;
    let msg;
    if (em.includes('already confirmed') || em.includes('already verified')) {
      msg = '✓ This email is already confirmed — just sign in.';
      errBox.classList.remove('show');
      errBox.classList.add('show', 'warn');
    } else if (code === 429 || em.includes('rate') || em.includes('too many') || em.includes('over_email_send_rate_limit')) {
      msg = 'Too many resend attempts. Please wait a minute and check your spam folder.';
      errBox.classList.remove('warn');
      errBox.classList.add('show');
    } else {
      msg = 'Could not resend: ' + (error.message || 'unknown error');
      errBox.classList.remove('warn');
      errBox.classList.add('show');
    }
    errBox.textContent = msg;
  } else {
    errBox.textContent = '✓ Confirmation email resent — check your inbox (and spam folder).';
    errBox.classList.remove('show');
    errBox.classList.add('show', 'warn');
  }
}

function escapeHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
</script>

<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/service-worker.js')
      .then(r => console.log('[SW] registered, scope:', r.scope))
      .catch(e => console.warn('[SW] registration failed:', e));
  });
}

// ── Show error from redirect (profile_missing) ────────────────────────────
(function checkRedirectError() {
  var params = new URLSearchParams(location.search);
  if (params.get('err') === 'profile_missing') {
    var box = document.getElementById('errBox');
    if (box) {
      box.innerHTML = 'Your account profile is not set up. If you were added as staff, ask your owner to check your account in the Staff tab. If you just signed up, confirm your email first, then try again.';
      box.classList.add('show');
      // Clean URL
      history.replaceState(null, '', location.pathname);
    }
  }
})();
</script>
